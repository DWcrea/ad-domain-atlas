# 京东 JD
#
# 京东的广告域（联盟、DSP）与商品/交易接口分得比较开，
# 按子域拦基本不会影响购物流程。

vendor: jd
domains:
  - domain: jd.com
    product: 京东主域
    category: infra
    owner: 京东
    purpose: 商品、订单、支付、账号登录的宿主域。
    verdict: keep
    scope: apex
    impact: 京东打不开、下不了单、付不了款。
    confidence: high
    tags: [基础设施, 高危误杀]

  - domain: ads-union.jd.com
    product: 京东联盟广告
    category: ad-serving
    owner: 京东
    purpose: 京东京准通联盟的广告投放与素材下发，站外媒体挂的京东商品推广位走这里。
    verdict: block
    scope: host
    impact: 站外京东推广位空白，站内购物不受影响。
    confidence: high
    tags: [电商广告, 联盟]

  - domain: dsp-x.jd.com
    product: 京东 DSP
    category: ad-exchange
    owner: 京东
    purpose: 京东的程序化广告投放平台（需求方平台），负责站外精准投放与竞价。
    verdict: block
    scope: host
    impact: 京东站外广告消失，购物流程正常。
    confidence: high
    tags: [DSP, 程序化]

  - domain: blackhole.m.jd.com
    product: 京东客户端埋点
    category: analytics
    owner: 京东
    purpose: 京东 App 的行为日志收集端点（内部叫「黑洞」），记录页面路径、点击、曝光。
    verdict: block-cost
    scope: host
    impact: 埋点丢失；部分 A/B 实验依赖它回传，极端情况下新功能不出现。
    confidence: medium
    tags: [埋点, 日志]

  - domain: mars.jd.com
    product: 京东内部服务（代号 Mars）
    category: infra
    owner: 京东
    purpose: 京东内部以行星/神话命名的服务之一（同族还有 uranus、mercury、hermes、cactus）。根路径 301 跳到京东首页，响应头带 Access-Control-Allow-Origin 全开，Server 为京东自研的 jfe，说明它是给前端 JS 调用的接口域，本身不提供页面。具体业务未公开。
    verdict: keep
    scope: host
    impact: 用途未公开，无法确认与广告有关；拦掉可能让京东某个页面模块拉不到数据。
    confidence: low
    tags: [接口域, 待验证]
    notes: anti-AD 收录了它，但同根域下还有 37 条京东域名（jrad、jzt、ads-union、dsp-x、x/u-x/img-x/ccc-x 等）明显是广告与追踪，mars 混在这堆里容易被一并处理。实测 CNAME 指向 mars.jd.com.gslb.qianxun.com（京东云千寻调度），A 记录 106.39.x / 120.52.x 属京东自有网段。

