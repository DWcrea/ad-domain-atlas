# Meta（Facebook）
#
# 这一家是「误杀重灾区」：登录、分享、广告归因共用域名。
# 想只拦广告，只能按主机名甚至按路径下手。

vendor: meta
domains:
  - domain: facebook.com
    product: Facebook 主域
    category: infra
    purpose: 账号登录、OAuth 授权、分享、Messenger 跳转的宿主域。
    verdict: keep
    scope: apex
    impact: 所有「用 Facebook 登录」的 App 与网站失效，分享按钮报错，OAuth 回调失败。
    confidence: high
    tags: [基础设施, 高危误杀]

  - domain: graph.facebook.com
    product: Facebook Graph API
    category: tracking
    purpose: Graph API 统一入口。既服务登录与好友关系（/me、/oauth），也承担广告归因与事件回传（/tr、/activities）。
    verdict: partial
    scope: host
    impact: 整域拦截会同时废掉 Facebook 登录与分享；只能按路径拦 /tr 一类广告端点。
    confidence: high
    tags: [登录, 广告归因, 混用]
    notes: AdGuard 可用路径规则，例如 `||graph.facebook.com/tr^`。但 App 内 SDK 常把参数拼进同一路径，按路径拦的稳定性不如按主机名。

  - domain: facebook.net
    product: Facebook 静态资源域
    category: infra
    purpose: 承载 connect.facebook.net 等前端 SDK 资源。
    verdict: keep
    scope: apex
    impact: 网页内嵌的 Facebook 组件（登录、评论、分享）全部失效。
    confidence: high
    tags: [基础设施]

  - domain: connect.facebook.net
    product: Facebook JS SDK / Pixel
    category: tracking
    purpose: 网页端 SDK 宿主。sdk.js 负责登录与分享，fbevents.js 负责 Meta Pixel 转化追踪，两者同域。
    verdict: block-cost
    scope: host
    impact: Pixel 被彻底阻断，但依赖 FB 登录的站点登录按钮也会一起失效。
    confidence: high
    tags: [Pixel, 网页SDK, 混用]
    notes: 只做广告拦截、不介意坏登录的场景可整域拦；否则建议只拦 `/signals/` 路径。

  - domain: an.facebook.com
    product: Meta Audience Network
    category: ad-serving
    purpose: 面向第三方 App 的横幅、插屏、激励视频广告请求与素材下发。
    verdict: block
    scope: host
    impact: App 内 Audience Network 广告位空白，不影响 Facebook 登录。
    confidence: high
    tags: [移动广告]

  - domain: fbcdn.net
    product: Facebook 内容 CDN
    category: infra
    purpose: 头像、图片、视频、静态资源分发。
    verdict: keep
    scope: apex
    impact: 图片与视频大面积加载失败，社交类 App 界面破版。
    confidence: high
    tags: [CDN, 高危误杀]
