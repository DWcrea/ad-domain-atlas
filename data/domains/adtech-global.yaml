    scope: apex
    impact: 广告位竞价失败。
    confidence: high
    tags: [SSP, RTB]

  - domain: magnite.com
    product: Magnite
    category: ad-exchange
    owner: Magnite
    purpose: Magnite 现行主域，承担 SSP 竞价与素材分发。
    verdict: block
    scope: apex
    impact: 广告位竞价失败。
    confidence: high
