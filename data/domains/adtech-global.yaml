# 国际程序化广告与第三方测量
#
# 以 Web 端为主，属于纯广告/监测基础设施，误杀风险最低的一组。
# 用 owner 标注实际厂商。

vendor: adtech-global
domains:
  - domain: criteo.com
    product: Criteo
    category: ad-serving
    owner: Criteo
    purpose: 重定向广告网络。靠 Cookie 追踪用户浏览过的商品，在别的网站再推一次。电商站几乎必装。
    verdict: block
    scope: apex
    impact: 「刚看过的东西到处跟着你」现象消失；商品页与下单不受影响。
    confidence: high
    tags: [重定向, 电商]

  - domain: criteo.net
    product: Criteo 投放与素材域
    category: ad-serving
    owner: Criteo
    purpose: Criteo 的广告投放、竞价与素材分发域，与 .com 分工不同。
    verdict: block
    scope: apex
    impact: 只拦 .com 会漏掉大部分广告请求。
    confidence: high
    tags: [重定向, 备用域名]

  - domain: taboola.com
    product: Taboola
    category: ad-serving
    owner: Taboola
    purpose: 内容推荐广告网络，网页底部「你可能感兴趣」「推荐阅读」的赞助内容。
    verdict: block
    scope: apex
    impact: 推荐位空白，正文不受影响。
    confidence: high
    tags: [原生广告, 内容推荐]

  - domain: outbrain.com
    product: Outbrain
    category: ad-serving
    owner: Outbrain
    purpose: 与 Taboola 同类的内容推荐广告网络。
    verdict: block
    scope: apex
    impact: 推荐位空白。
    confidence: high
    tags: [原生广告, 内容推荐]

  - domain: pubmatic.com
    product: PubMatic
    category: ad-exchange
    owner: PubMatic
    purpose: 卖方平台（SSP），帮媒体把广告位拿到交易所竞价。
    verdict: block
    scope: apex
    impact: 广告位竞价失败，广告空白。
    confidence: high
    tags: [SSP, RTB]

